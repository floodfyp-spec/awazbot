[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awaz_core"
version = "0.1.0"
description = "AwazBot KP core shared library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
